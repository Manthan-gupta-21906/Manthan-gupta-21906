<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="namegrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#7B2FBE"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style><![CDATA[
      .dot { animation: pulse 3s ease-in-out infinite; }
      .d0{animation-delay:0s}.d1{animation-delay:0.4s}.d2{animation-delay:0.8s}
      .d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
      .d6{animation-delay:2.4s}.d7{animation-delay:2.8s}
      @keyframes pulse{0%,100%{opacity:0.1}50%{opacity:0.8}}
      .grid{animation:gridfade 5s ease-in-out infinite}
      @keyframes gridfade{0%,100%{opacity:0.04}50%{opacity:0.12}}
      .cursor{animation:blink 1.2s step-end infinite}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      .scanline{animation:scan 8s linear infinite}
      @keyframes scan{0%{transform:translateY(-200px)}100%{transform:translateY(400px)}}
    ]]></style>
  </defs>

  <rect width="900" height="200" fill="url(#bg)" rx="10"/>

  <!-- Animated scanline -->
  <rect class="scanline" x="0" y="0" width="900" height="2" fill="#00B4D8" opacity="0.06" rx="1"/>

  <!-- Grid -->
  <g class="grid" stroke="#00B4D8" stroke-width="0.4" fill="none">
    <line x1="0" y1="50" x2="900" y2="50"/>
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="180" y1="0" x2="180" y2="200"/>
    <line x1="360" y1="0" x2="360" y2="200"/>
    <line x1="540" y1="0" x2="540" y2="200"/>
    <line x1="720" y1="0" x2="720" y2="200"/>
  </g>

  <!-- Left dots -->
  <circle class="dot d0" cx="40" cy="30" r="3" fill="#00B4D8"/>
  <circle class="dot d1" cx="90" cy="65" r="2" fill="#7B2FBE"/>
  <circle class="dot d2" cx="55" cy="110" r="2.5" fill="#00B4D8"/>
  <circle class="dot d3" cx="120" cy="145" r="2" fill="#7B2FBE"/>
  <circle class="dot d4" cx="30" cy="160" r="2" fill="#00B4D8"/>
  <circle class="dot d5" cx="140" cy="30" r="2" fill="#7B2FBE"/>
  <circle class="dot d6" cx="70" cy="180" r="2" fill="#00B4D8"/>
  <circle class="dot d7" cx="110" cy="90" r="1.5" fill="#7B2FBE"/>

  <!-- Right dots -->
  <circle class="dot d3" cx="860" cy="30" r="3" fill="#7B2FBE"/>
  <circle class="dot d0" cx="810" cy="65" r="2" fill="#00B4D8"/>
  <circle class="dot d5" cx="845" cy="110" r="2.5" fill="#7B2FBE"/>
  <circle class="dot d2" cx="780" cy="145" r="2" fill="#00B4D8"/>
  <circle class="dot d7" cx="870" cy="160" r="2" fill="#7B2FBE"/>
  <circle class="dot d1" cx="760" cy="30" r="2" fill="#00B4D8"/>
  <circle class="dot d4" cx="830" cy="180" r="2" fill="#7B2FBE"/>
  <circle class="dot d6" cx="790" cy="90" r="1.5" fill="#00B4D8"/>

  <!-- Corner brackets -->
  <path d="M15,15 L15,5 L25,5" stroke="#00B4D8" stroke-width="1.8" fill="none" opacity="0.7"/>
  <path d="M885,15 L885,5 L875,5" stroke="#7B2FBE" stroke-width="1.8" fill="none" opacity="0.7"/>
  <path d="M15,185 L15,195 L25,195" stroke="#7B2FBE" stroke-width="1.8" fill="none" opacity="0.7"/>
  <path d="M885,185 L885,195 L875,195" stroke="#00B4D8" stroke-width="1.8" fill="none" opacity="0.7"/>

  <!-- Top/bottom accent lines -->
  <line x1="0" y1="1" x2="900" y2="1" stroke="#00B4D8" stroke-width="2" opacity="0.5"/>
  <line x1="0" y1="199" x2="900" y2="199" stroke="#7B2FBE" stroke-width="2" opacity="0.5"/>

  <!-- Terminal prompt left decoration -->
  <text x="170" y="103" font-family="'Courier New',monospace" font-size="20" fill="#00B4D8" opacity="0.25" dominant-baseline="middle">&gt;_</text>

  <!-- Main Name -->
  <text x="450" y="95" font-family="'Courier New',monospace" font-size="50" font-weight="bold"
        text-anchor="middle" dominant-baseline="middle" fill="url(#namegrad)" filter="url(#glow)">
    Manthan Gupta
  </text>

  <!-- Subtitle -->
  <text x="450" y="145" font-family="'Courier New',monospace" font-size="14"
        text-anchor="middle" fill="#8B949E" letter-spacing="2">
    AI &amp; Data Science  ·  Computer Vision  ·  Builder
  </text>

  <!-- Blinking cursor right -->
  <text class="cursor" x="710" y="103" font-family="'Courier New',monospace" font-size="20"
        fill="#7B2FBE" opacity="0.3" dominant-baseline="middle">&#x2588;</text>
</svg>
